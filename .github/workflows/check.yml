# Read-only Terraform checks.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: tf-version
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff

  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: tf-version
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}
          terraform_wrapper: false
      - name: Validate stacks and modules
        shell: bash
        run: |
          set -euo pipefail

          # check <dir> [init flags...]: init and validate one folder, naming it on failure.
          check() {
            local dir=$1
            shift
            echo "::group::$dir"
            if ! terraform -chdir="$dir" init -input=false -backend=false "$@" \
              || ! terraform -chdir="$dir" validate; then
              echo "::endgroup::"
              echo "::error::terraform init/validate failed in $dir"
              exit 1
            fi
            echo "::endgroup::"
          }

          # Stacks must use their committed lock files without changing them.
          while read -r dir; do
            check "$dir" -lockfile=readonly
          done < <(find stacks -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u)

          # Modules have no lock files, so init them normally.
          for dir in modules/*/; do
            dir=${dir%/}
            if compgen -G "$dir/*.tf" > /dev/null; then
              check "$dir"
            fi
          done

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --format compact
